name = "stepinside-assets"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

[observability]
enabled = true

# Scan assets live in R2 (provisioned once: npx wrangler r2 bucket create
# stepinside-assets). Keys are {propertyId}/{version}/{path}.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "stepinside-assets"
