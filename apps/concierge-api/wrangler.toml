name = "concierge-api"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY (concierge) and GEMINI_API_KEY (/stage virtual staging,
# "Nano Banana" = Gemini 2.5 Flash Image) are provided as secrets, never committed:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
# For `wrangler dev` / the Node dev server, place them in .dev.vars (gitignored):
#   ANTHROPIC_API_KEY=sk-...
#   GEMINI_API_KEY=...
#
# Optional: comma-separated origin allowlist for CORS. If unset, a built-in
# localhost dev allowlist is used.
#   ALLOWED_ORIGINS=https://viewer.example.com

# --- Rate limiting + daily spend cap (KV) ------------------------------------
# Real (cross-isolate) rate limiting AND the /stage global daily spend cap
# require a KV namespace bound as RATE_LIMIT_KV. Without it the worker falls
# back to a weak per-isolate in-memory limiter and the spend cap is disabled
# (it logs a warning on the first request).
#
# Provision once (needs account access), then uncomment with the printed id:
#   npx wrangler kv namespace create RATE_LIMIT_KV
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<id printed by the create command>"

# Optional /stage hardening (details in README.md):
#
#   STAGE_DAILY_LIMIT — max staged images per UTC day across ALL visitors
#   (kill-switch against cost abuse; default 200; requires RATE_LIMIT_KV):
# [vars]
# STAGE_DAILY_LIMIT = "200"
#
#   STAGE_AUTH_TOKEN — when set, /stage requires a matching `x-stage-token`
#   header (401 otherwise). Leave unset for the frictionless public demo.
#   wrangler secret put STAGE_AUTH_TOKEN
