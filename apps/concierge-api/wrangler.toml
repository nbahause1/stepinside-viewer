name = "concierge-api"
main = "src/worker.ts"
# Pin the production Cloudflare account explicitly. The deploy account
# (haukecux19@gmail.com) has access to MORE than one account; without this,
# a non-interactive `wrangler deploy` can pick the wrong one and fail with a
# 10000 auth error / "KV namespace not found". This is the account that owns
# innsyn-analytics (D1) + RATE_LIMIT_KV (see bindings below).
account_id = "78f5f61b0df30eff8533ff5cc6ec3eb7"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: without this block every console.warn/error vanishes unless
# someone happens to be running `wrangler tail`. Persisted logs enable the
# dashboard + alerts (e.g. on BUDGET_EXHAUSTED, see ratelimit.ts).
[observability]
enabled = true

# Nightly maintenance (04:15 UTC): prune anonymous events older than 90 days
# (see EVENTS_RETENTION_DAYS in worker.ts). Leads are never auto-deleted.
[triggers]
crons = ["15 4 * * *"]

# Reference furniture photos for /stage are bundled as raw bytes (Workers has
# no filesystem). Scoped to staging-refs so no other asset type is affected.
[[rules]]
type = "Data"
globs = ["**/*.jpg", "**/*.png"]
fallthrough = true

# ANTHROPIC_API_KEY (concierge) and GEMINI_API_KEY (/stage virtual staging,
# "Nano Banana" = Gemini 2.5 Flash Image) are provided as secrets, never committed:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
# For `wrangler dev` / the Node dev server, place them in .dev.vars (gitignored):
#   ANTHROPIC_API_KEY=sk-...
#   GEMINI_API_KEY=...
#
# Optional: comma-separated origin allowlist for CORS. If unset, a built-in
# localhost dev allowlist is used.
#   ALLOWED_ORIGINS=https://viewer.example.com
#
# --- Rate limiting + daily spend/flood caps (KV) ------------------------------
# Real (cross-isolate) rate limiting AND the global daily caps (/stage,
# concierge, /events, /lead) require a KV namespace bound as RATE_LIMIT_KV.
# Without it the worker falls back to a weak per-isolate in-memory limiter and
# the daily caps are disabled (it logs a warning on the first request). All
# KV-backed limits are SOFT: on a KV error they log a warning and fail open
# (see README.md).
#
# Provision once (needs account access), then uncomment with the printed id:
#   npx wrangler kv namespace create RATE_LIMIT_KV

# KV im Account haukecux19@gmail.com ("stepinside-eu", aktuelles Deploy-Ziel)
# — aktiviert die harten Cross-Isolate-Limits UND die globalen Tages-Not-Aus-
# Budgets (CONCIERGE_DAILY_LIMIT etc.). Der ZWEITE Cloudflare-Account
# (Subdomain "stepinside") hat ein eigenes Namespace 40014ed5…; bei der
# Account-Konsolidierung die ID des Gewinner-Accounts eintragen.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "90ab5895edcb416fa9283bbcba6d4eca"

# --- Anonymous analytics + leads (D1) ----------------------------------------
# /events, /lead and /report/{propertyId} require a D1 database bound as
# ANALYTICS_DB. Without it the worker still works: /events and /lead answer
# 202 and drop silently, /report/* is a uniform 404 — the viewer never breaks.
#
# Privacy model (see README.md): no cookies, no IP addresses, no user agents;
# the session id is crypto-random and in-memory only.
#
# Provisioned 2026-07-14 im Account haukecux19@gmail.com (finaler Account,
# Konsolidierung entschieden). Die alte DB 933ec231… ("stepinside-analytics")
# lag im zweiten Account und ist verwaist.
# (local dev against `wrangler dev`: npx wrangler d1 migrations apply innsyn-analytics --local)
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "innsyn-analytics"
database_id = "5a990b1f-3e10-4a67-8718-444ffcaa0ef9"
migrations_dir = "migrations"

# Optional hardening (details in README.md):
#
#   STAGE_DAILY_LIMIT — max staged images per UTC day across ALL visitors
#   (kill-switch against cost abuse; default 200; requires RATE_LIMIT_KV).
#   CONCIERGE_DAILY_LIMIT — max concierge chat turns per UTC day across ALL
#   visitors (default 1000; requires RATE_LIMIT_KV).
#   EVENTS_DAILY_LIMIT — max /events batches stored per UTC day (flood cap for
#   D1/the report; default 50000; past the cap: 202 + silent drop).
#   LEAD_DAILY_LIMIT — max leads stored per UTC day (default 200; past the
#   cap: 429 with Retry-After):
[vars]
# Exact-match origin allowlist (see src/cors.ts). Production site + branch
# previews + local dev (Next.js on 3000, viewer on 4500, incl. LAN IPs used
# for on-device iPhone testing). Bewusst KEIN Wildcard: sonst könnte jede
# fremde Seite auf unsere Kosten Modell-Anfragen stellen.
ALLOWED_ORIGINS = "https://myinnsyn.de,https://www.myinnsyn.de,https://stepinside.eu,https://www.stepinside.eu,https://stepinside-viewer-git-analytics-leads-nbahauses-projects.vercel.app,https://stepinside-viewer-git-concierge-endprodukt-nbahauses-projects.vercel.app,https://stepinside-viewer-git-concierge-merge-nbahauses-projects.vercel.app,https://stepinside-viewer-git-aker-redesign-nbahauses-projects.vercel.app,https://stepinside-viewer-git-ios-concierge-chips-nbahauses-projects.vercel.app,https://stepinside-viewer-git-tour-preview-nbahauses-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://192.168.0.146:3000,http://192.168.0.201:3000,http://192.168.2.123:3000,http://localhost:4500,http://127.0.0.1:4500,http://192.168.0.201:4500"
STAGE_DAILY_LIMIT = "200"
CONCIERGE_DAILY_LIMIT = "1000"
EVENTS_DAILY_LIMIT = "50000"
LEAD_DAILY_LIMIT = "200"
#
#   STAGE_AUTH_TOKEN — when set, /stage requires a matching `x-stage-token`
#   header (401 otherwise). Leave unset for the frictionless public demo.
#   wrangler secret put STAGE_AUTH_TOKEN
