name = "concierge-api"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY (concierge) and GEMINI_API_KEY (/stage virtual staging,
# "Nano Banana" = Gemini 2.5 Flash Image) are provided as secrets, never committed:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
# For `wrangler dev` / the Node dev server, place them in .dev.vars (gitignored):
#   ANTHROPIC_API_KEY=sk-...
#   GEMINI_API_KEY=...
#
# Optional: comma-separated origin allowlist for CORS. If unset, a built-in
# localhost dev allowlist is used.
#   ALLOWED_ORIGINS=https://viewer.example.com
#
# Exakte Origin-Allowlist: Produktionsdomains + die Vercel-Preview-Origin des
# Feature-Branches (wird nach jedem Preview-Deploy bei Bedarf ergänzt). Bewusst
# KEIN Wildcard: sonst könnte jede fremde Seite auf unsere Kosten Modell-
# Anfragen stellen.
[vars]
ALLOWED_ORIGINS = "https://www.stepinside.eu,https://stepinside.eu"

# Production rate limiting should use a KV namespace or Durable Object so that
# limits are shared across isolates (see KvRateLimiter in src/ratelimit.ts).
# Example once provisioned:
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<kv-namespace-id>"
