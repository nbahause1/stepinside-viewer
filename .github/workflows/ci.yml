name: CI

on:
  push:
    branches: [aker-redesign, analytics-leads]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    # Full production build: exercises the prebuild hook, which installs and
    # builds the viewer and syncs its artifacts — so a broken viewer build or
    # a broken sync fails HERE, not on the Vercel prod deploy.
    name: website (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/website/package-lock.json
            apps/viewer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: bundle size guard
        # The viewer bundle is the mobile-loadtime budget. Fails when the
        # minified main chunk grows past 2.4 MB raw (currently ~1.9 MB).
        run: |
          size=$(wc -c < $(ls public/viewer/index-*.js | head -1))
          echo "viewer main chunk: ${size} bytes"
          test "$size" -lt 2400000

  concierge-api:
    name: concierge-api (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/concierge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/concierge-api/package-lock.json
      - run: npm ci
      - run: npm run type:check
      - run: npm test

  viewer:
    name: viewer (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - run: npm ci
      - run: npm run type:check
