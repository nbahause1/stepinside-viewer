name: CI

on:
  push:
    branches: [aker-redesign, analytics-leads]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    # Rebuilds the viewer from source and RE-SYNCS its artifacts, then asserts
    # the committed public/viewer matches that fresh build. Vercel serves the
    # committed artifacts (there is no prebuild hook), so this is what catches a
    # broken viewer build, a dropped chunk (sync reference-integrity assertion),
    # or stale committed artifacts (drift guard) — HERE, not on the prod deploy.
    # (This is the maplibre-gl incident class made into a red build.)
    name: website (viewer rebuild + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/website/package-lock.json
            apps/viewer/package-lock.json
      - run: npm ci
      - name: install viewer deps
        # sync:viewer builds the viewer (cd ../viewer && npm run build); its deps
        # (e.g. maplibre-gl) must be present or the build silently drops a chunk.
        run: npm ci --prefix ../viewer
      - name: rebuild + sync viewer
        # Runs the sync's reference-integrity assertion: any `./X.js` referenced
        # by the HTML/chunks but missing from the output fails the build.
        run: npm run sync:viewer
      - name: viewer artifact drift guard
        # A fresh build of unchanged source yields identical content-hashed
        # chunks, so a clean tree here proves the committed artifacts are current.
        # `git status --porcelain` (NOT `git diff`) so a brand-NEW untracked chunk
        # — the maplibre incident class — also trips the guard, not just modified
        # tracked files. If this fails: run `npm run sync:viewer` locally and
        # commit public/viewer.
        run: |
          drift=$(git status --porcelain -- public/viewer)
          if [ -n "$drift" ]; then
            echo "Committed public/viewer is out of sync with a fresh build:"
            echo "$drift"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npm run build
      - name: bundle size guard
        # The viewer bundle is the mobile-loadtime budget. Fails when the
        # minified main chunk grows past 2.4 MB raw (currently ~1.9 MB).
        run: |
          size=$(wc -c < $(ls public/viewer/index-*.js | head -1))
          echo "viewer main chunk: ${size} bytes"
          test "$size" -lt 2400000

  concierge-api:
    name: concierge-api (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/concierge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/concierge-api/package-lock.json
      - run: npm ci
      - run: npm run type:check
      - run: npm test

  viewer:
    name: viewer (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - run: npm ci
      - run: npm run type:check
